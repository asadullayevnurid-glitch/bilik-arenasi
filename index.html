<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilik Arenası — Onlayn Sınaq Platforması</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: #f5f3ff;
      color: #0f172a;
      line-height: 1.5;
    }
    .topbar {
      background: #ffffff;
      border-bottom: 1px solid #ede9fe;
      padding: 10px 16px;
    }
    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #4c1d95;
      color: #fde047;
      display: grid;
      place-items: center;
      font-weight: 800;
    }
    .brand-title {
      font-weight: 800;
      font-size: 0.92rem;
      color: #2e1065;
    }
    .brand-sub {
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 600;
    }
    .nav-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 7px 13px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .container {
      max-width: 960px;
      margin: 18px auto 48px;
      padding: 0 16px;
    }
    .hero-card {
      border-radius: 22px;
      padding: 24px 20px;
      background: linear-gradient(155deg, #4c1d95 0%, #3b0764 55%, #2e1065 100%);
      color: #ffffff;
      box-shadow: 0 14px 32px rgba(46, 16, 101, 0.22);
    }
    .hero-title-box {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 18px;
      border-radius: 16px;
      background: rgba(24, 7, 56, 0.55);
      border: 1.5px solid rgba(250, 204, 21, 0.65);
      text-align: center;
    }
    .hero-main-title {
      margin: 0;
      font-size: clamp(1.5rem, 4.5vw, 2.3rem);
      font-weight: 800;
    }
    .hero-sub-line {
      margin-top: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fde047;
    }
    .hero-motto {
      max-width: 440px;
      margin: 12px auto 18px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #fef08a;
      color: #2e1065;
      font-size: 0.82rem;
      font-weight: 800;
      text-align: center;
    }
    .hero-features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .hero-pill {
      background: #ffffff;
      color: #2e1065;
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
      font-size: 0.76rem;
      font-weight: 800;
    }
    .section-title {
      margin: 24px 0 2px;
      font-size: 1.3rem;
      font-weight: 800;
    }
    .section-sub {
      margin: 0 0 14px;
      font-size: 0.84rem;
      color: #64748b;
      font-weight: 600;
    }
