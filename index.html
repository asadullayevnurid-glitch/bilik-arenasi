<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilik Arenası — Onlayn Sınaq Platforması</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f0ff;
      --card: #ffffff;
      --primary: #4c1d95;
      --primary-dark: #2e1065;
      --accent: #f59e0b;
      --text: #0f172a;
      --muted: #475569;
      --border: #ddd6fe;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --bad: #b91c1c;
      --bad-bg: #fee2e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 880px;
      margin: 18px auto 40px;
      padding: 0 14px;
    }
    .hero-banner {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(46, 16, 101, 0.22);
      border: 2px solid #c4b5fd;
      background: #2e1065;
      margin-bottom: 14px;
    }
    .hero-banner img {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: cover;
    }
    .teacher-bar {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary-dark);
      margin-bottom: 18px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(46, 16, 101, 0.06);
      margin-bottom: 16px;
    }
    .grid-grades {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .grade-btn {
      padding: 12px 8px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #faf5ff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text);
      cursor: pointer;
    }
    .grade-btn.active {
      border-color: var(--primary);
      background: #ede9fe;
      color: var(--primary-dark);
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.94rem;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-confirm {
      background: #6d28d9;
      color: #fff;
    }
    .btn-confirm:hover { background: #4c1d95; }
    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .timer {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.88rem;
    }
    .q-img {
      display: block;
      max-width: 100%;
      max-height: 270px;
      margin: 12px auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .option {
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      background: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .option.picked {
      border-color: var(--primary);
      background: #f3e8ff;
      font-weight: 700;
    }
    .option.correct {
      border-color: var(--ok);
      background: var(--ok-bg);
      color: var(--ok);
      font-weight: 800;
    }
    .option.wrong {
      border-color: var(--bad);
      background: var(--bad-bg);
      color: var(--bad);
      font-weight: 800;
    }
    .feedback-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      border-left: 5px solid var(--primary);
      background: #f8fafc;
    }
    .feedback-box.ok {
      border-left-color: var(--ok);
      background: #f0fdf4;
    }
    .feedback-box.bad {
      border-left-color: var(--bad);
      background: #fef2f2;
    }
    .status-tag {
      font-weight: 800;
      font-size: 0.98rem;
      margin-bottom: 6px;
    }
    .status-tag.ok { color: var(--ok); }
    .status-tag.bad { color: var(--bad); }
    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .hidden { display: none; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.84rem;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero-banner">
      <img src="banner.png" alt="Bilik Arenası — Onlayn Sınaq Platforması" />
    </div>
    <div class="teacher-bar">Müəllim: Nurid Əsədullayev</div>

    <div id="start-screen" class="card">
      <h2 style="margin:0;">Sinif seçin və sınağa başlayın</h2>
      <p style="color:var(--muted); margin:6px 0 0;">
        Variantı seçib <strong>Təsdiqlə</strong> düyməsinə basın: cavab düz olsa yaşıl, səhv olsa qırmızı rənglənəcək və izahı görünəcək.
      </p>
      <div class="grid-grades" id="grade-list"></div>
      <div style="margin-top:18px;">
        <button type="button" class="btn" id="start-btn">Sınağa başla</button>
      </div>
    </div>

    <div id="quiz-screen" class="card hidden">
      <div class="top-bar">
        <span id="q-progress">Sual 1 / 20</span>
        <span id="q-grade-label" style="color:var(--primary);"></span>
        <span class="timer" id="timer">40:00</span>
      </div>
      <h3 id="q-text" style="margin:10px 0 0; font-size:1.08rem;"></h3>
      <img id="q-img" class="q-img hidden" alt="Sual şəkli" />
      <div class="options" id="options-box"></div>

      <div style="margin-top:8px;">
        <button type="button" class="btn btn-confirm" id="confirm-btn">Cavabı təsdiqlə</button>
      </div>

      <div id="feedback-box" class="feedback-box hidden">
        <div id="status-tag" class="status-tag"></div>
        <div id="explain-text"></div>
      </div>

      <div class="nav-row">
        <button type="button" class="btn btn-secondary" id="prev-btn">Əvvəlki</button>
        <button type="button" class="btn" id="next-btn">Növbəti</button>
        <button type="button" class="btn hidden" id="finish-btn">Sınağı bitir</button>
      </div>
    </div>

    <div id="result-screen" class="card hidden">
      <h2 style="margin:0;">Sınağın yekun nəticəsi</h2>
      <p id="score-summary" style="font-size:1.1rem; font-weight:800; margin:10px 0 14px;"></p>
      <div id="review-box"></div>
      <div style="margin-top:18px;">
        <button type="button" class="btn" id="restart-btn">Ana səhifəyə qayıt</button>
      </div>
    </div>

    <footer>Bilik Arenası • Müəllim: Nurid Əsədullayev</footer>
  </div>

  <script>
    const customQuestions = {};

    function buildQuestionsForGrade(grade) {
      if (Array.isArray(customQuestions[grade]) && customQuestions[grade].length > 0) {
        return customQuestions[grade];
      }
      const list = [];
      for (let i = 1; i <= 20; i++) {
        const a = i * 2 + grade;
        const b = i + 3;
        const ans = String(a + b);
        const opts = [ans, String(a + b + 2), String(Math.max(1, a + b - 2)), String(a + b + 4)]
          .sort((x, y) => Number(x) - Number(y));

        list.push({
          q: `${grade}-ci sinif — Sual ${i}: ${a} + ${b} ifadəsinin qiymətini tapın.`,
          img: "",
          options: opts,
          answer: ans,
          explain: `${a} + ${b} = ${ans} edir.`
        });
      }
      return list;
    }

    let selectedGrade = 5;
    let questions = [];
    let currentIdx = 0;
    let pickedAnswers = {};
    let confirmedAnswers = {};
    let secondsLeft = 40 * 60;
    let timerInterval = null;

    const gradeListEl = document.getElementById("grade-list");
    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    for (let g = 1; g <= 11; g++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "grade-btn" + (g === selectedGrade ? " active" : "");
      btn.textContent = `${g}-ci sinif`;
      btn.addEventListener("click", () => {
        selectedGrade = g;
        document.querySelectorAll(".grade-btn").forEach(el => el.classList.remove("active"));
        btn.classList.add("active");
      });
      gradeListEl.appendChild(btn);
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function startQuiz() {
      questions = buildQuestionsForGrade(selectedGrade);
      currentIdx = 0;
      pickedAnswers = {};
      confirmedAnswers = {};
      secondsLeft = 40 * 60;

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      document.getElementById("q-grade-label").textContent = `${selectedGrade}-ci sinif`;

      renderQuestion();

      clearInterval(timerInterval);
      document.getElementById("timer").textContent = formatTime(secondsLeft);
      timerInterval = setInterval(() => {
        secondsLeft = Math.max(0, secondsLeft - 1);
        document.getElementById("timer").textContent = formatTime(secondsLeft);
        if (secondsLeft === 0) {
          clearInterval(timerInterval);
          finishQuiz();
        }
      }, 1000);
    }

    function renderQuestion() {
      const item = questions[currentIdx];
      const picked = pickedAnswers[currentIdx];
      const isConfirmed = Boolean(confirmedAnswers[currentIdx]);

      document.getElementById("q-progress").textContent = `Sual ${currentIdx + 1} / ${questions.length}`;
      document.getElementById("q-text").textContent = item.q;

      const imgEl = document.getElementById("q-img");
      if (item.img && item.img.trim() !== "") {
        imgEl.src = item.img.trim();
        imgEl.classList.remove("hidden");
      } else {
        imgEl.removeAttribute("src");
        imgEl.classList.add("hidden");
      }

      const optionsBox = document.getElementById("options-box");
      optionsBox.innerHTML = "";

      item.options.forEach(opt => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "option";
        b.textContent = opt;

        if (!isConfirmed) {
          if (picked === opt) b.classList.add("picked");
          b.addEventListener("click", () => {
            pickedAnswers[currentIdx] = opt;
            renderQuestion();
          });
        } else {
          b.disabled = true;
          if (opt === item.answer) {
            b.classList.add("correct");
          } else if (picked === opt && picked !== item.answer) {
            b.classList.add("wrong");
          }
        }
        optionsBox.appendChild(b);
      });

      const confirmBtn = document.getElementById("confirm-btn");
      confirmBtn.disabled = !picked || isConfirmed;
      confirmBtn.textContent = isConfirmed ? "Təsdiqlənib" : "Cavabı təsdiqlə";

      const feedbackBox = document.getElementById("feedback-box");
      const statusTag = document.getElementById("status-tag");
      const explainText = document.getElementById("explain-text");

      if (isConfirmed) {
        const isCorrect = picked === item.answer;
        feedbackBox.classList.remove("hidden", "ok", "bad");
        statusTag.classList.remove("ok", "bad");

        if (isCorrect) {
          feedbackBox.classList.add("ok");
          statusTag.classList.add("ok");
          statusTag.textContent = "✓ Düzgün cavab";
        } else {
          feedbackBox.classList.add("bad");
          statusTag.classList.add("bad");
          statusTag.textContent = `✕ Səhv cavab (Düzgün cavab: ${item.answer})`;
        }
        explainText.textContent = `İzah: ${item.explain}`;
      } else {
        feedbackBox.classList.add("hidden");
      }

      document.getElementById("prev-btn").disabled = currentIdx === 0;
      const isLast = currentIdx === questions.length - 1;
      document.getElementById("next-btn").classList.toggle("hidden", isLast);
      document.getElementById("finish-btn").classList.toggle("hidden", !isLast);
    }

    document.getElementById("confirm-btn").addEventListener("click", () => {
      if (!pickedAnswers[currentIdx]) return;
      confirmedAnswers[currentIdx] = true;
      renderQuestion();
    });

    function finishQuiz() {
      clearInterval(timerInterval);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      let correctCount = 0;
      const reviewBox = document.getElementById("review-box");
      reviewBox.innerHTML = "";

      questions.forEach((item, idx) => {
        const picked = pickedAnswers[idx];
        const isCorrect = picked === item.answer;
        if (isCorrect) correctCount++;

        const div = document.createElement("div");
        div.className = "feedback-box " + (isCorrect ? "ok" : "bad");
        div.innerHTML = `
          <div class="status-tag ${isCorrect ? "ok" : "bad"}">${idx + 1}. ${isCorrect ? "✓ Düzgün" : "✕ Səhv"}</div>
          <div>${item.q}</div>
          <div style="margin-top:6px;">Sizin cavabınız: <strong>${picked || "Cavab verilməyib"}</strong> | Düzgün cavab: <strong>${item.answer}</strong></div>
          <div style="margin-top:4px;">İzah: ${item.explain}</div>
        `;
        reviewBox.appendChild(div);
      });

      document.getElementById("score-summary").textContent =
        `${selectedGrade}-ci sinif üzrə nəticə: ${correctCount} / ${questions.length} düzgün cavab`;
    }

    document.getElementById("start-btn").addEventListener("click", startQuiz);
    document.getElementById("prev-btn").addEventListener("click", () => {
      if (currentIdx > 0) { currentIdx--; renderQuestion(); }
    });
    document.getElementById("next-btn").addEventListener("click", () => {
      if (currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); }
    });
    document.getElementById("finish-btn").addEventListener("click", finishQuiz);
    document.getElementById("restart-btn").addEventListener("click", () => {
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });
  </script>
</body>
</html>
