<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilik Arenası — Riyaziyyat Sınaq Platforması</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f6fc;
      --card: #ffffff;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --accent: #0ea5e9;
      --text: #0f172a;
      --muted: #475569;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --bad: #b91c1c;
      --bad-bg: #fee2e2;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary), var(--accent));
      color: #fff;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(29, 78, 216, 0.2);
    }
    header h1 { margin: 0 0 6px; font-size: 1.8rem; font-weight: 800; }
    header p { margin: 0; font-size: 0.95rem; opacity: 0.95; }
    .container { max-width: 860px; margin: 24px auto; padding: 0 14px 40px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      margin-bottom: 18px;
    }
    .grid-grades {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    button.grade-btn {
      padding: 12px 10px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      font-family: inherit;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: 0.15s;
    }
    button.grade-btn:hover, button.grade-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary-dark);
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }
    .btn-secondary:hover { background: #cbd5e1; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .timer {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
    }
    .options { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
    .option {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      background: #fff;
      font-family: inherit;
      font-size: 0.96rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .option:hover { border-color: var(--accent); background: #f0f9ff; }
    .option.selected { border-color: var(--primary); background: #dbeafe; font-weight: 600; }
    .explain {
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      font-size: 0.92rem;
    }
    .ok { background: var(--ok-bg); color: var(--ok); padding: 10px 14px; border-radius: 10px; font-weight: 700; }
    .bad { background: var(--bad-bg); color: var(--bad); padding: 10px 14px; border-radius: 10px; font-weight: 700; }
    .nav-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
    .hidden { display: none; }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Bilik Arenası</h1>
    <p>1–11-ci siniflər üzrə onlayn riyaziyyat sınaq platforması • Müəllim: Nurid Əsədullayev</p>
  </header>

  <div class="container">
    <div id="start-screen" class="card">
      <h2>Sinif seçin və sınağa başlayın</h2>
      <p style="color:var(--muted); margin-top:4px;">Hər sınaq 20 sual, 40 dəqiqə vaxt və ətraflı izahlarla tərtib olunub.</p>
      <div class="grid-grades" id="grade-list"></div>
      <div style="margin-top:20px;">
        <button class="btn" id="start-btn">Sınağa başla</button>
      </div>
    </div>

    <div id="quiz-screen" class="card hidden">
      <div class="top-bar">
        <span id="q-progress">Sual 1 / 20</span>
        <span id="q-grade-label" style="color:var(--primary);"></span>
        <span class="timer" id="timer">40:00</span>
      </div>
      <h3 id="q-text" style="margin: 10px 0 0; font-size: 1.1rem;"></h3>
      <div class="options" id="options-box"></div>
      <div id="instant-explain" class="explain hidden"></div>
      <div class="nav-row">
        <button class="btn btn-secondary" id="prev-btn">Əvvəlki</button>
        <button class="btn" id="next-btn">Növbəti</button>
        <button class="btn hidden" id="finish-btn">Sınağı bitir</button>
      </div>
