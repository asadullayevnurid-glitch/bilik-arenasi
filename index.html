<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilik Arenası — Riyaziyyat Sınaq Platforması</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f6fc;
      --card: #ffffff;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --accent: #0ea5e9;
      --text: #0f172a;
      --muted: #475569;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --bad: #b91c1c;
      --bad-bg: #fee2e2;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary), var(--accent));
      color: #fff;
      padding: 22px 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(29, 78, 216, 0.2);
    }
    header h1 { margin: 0 0 6px; font-size: 1.75rem; font-weight: 800; }
    header p { margin: 0; font-size: 0.92rem; opacity: 0.96; }
    .container { max-width: 860px; margin: 20px auto; padding: 0 14px 36px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      margin-bottom: 16px;
    }
    .grid-grades {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .grade-btn {
      padding: 12px 8px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text);
      cursor: pointer;
    }
    .grade-btn.active {
      border-color: var(--primary);
      background: #dbeafe;
      color: var(--primary-dark);
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .timer {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.88rem;
    }
    .q-img {
      display: block;
      max-width: 100%;
      max-height: 280px;
      margin: 12px auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .options { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
    .option {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      background: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .option.selected {
      border-color: var(--primary);
      background: #dbeafe;
      font-weight: 700;
    }
    .explain {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      font-size: 0.9rem;
    }
    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .hidden { display: none; }
    footer { text-align: center; color: var(--muted); font-size: 0.84rem; margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Bilik Arenası</h1>
    <p>1–11-ci siniflər üzrə onlayn riyaziyyat sınaq platforması • Müəllim: Nurid Əsədullayev</p>
  </header>

  <div class="container">
    <div id="start-screen" class="card">
      <h2 style="margin:0;">Sinif seçin və sınağa başlayın</h2>
      <p style="color:var(--muted); margin:6px 0 0;">Hər sınaq 20 sual, 40 dəqiqə vaxt və ətraflı izahlarla tərtib olunub.</p>
      <div class="grid-grades" id="grade-list"></div>
      <div style="margin-top:18px;">
        <button type="button" class="btn" id="start-btn">Sınağa başla</button>
      </div>
    </div>

    <div id="quiz-screen" class="card hidden">
      <div class="top-bar">
        <span id="q-progress">Sual 1 / 20</span>
        <span id="q-grade-label" style="color:var(--primary);"></span>
        <span class="timer" id="timer">40:00</span>
      </div>
      <h3 id="q-text" style="margin:10px 0 0; font-size:1.08rem;"></h3>
      <img id="q-img" class="q-img hidden" alt="Sual şəkli" />
      <div class="options" id="options-box"></div>
      <div id="instant-explain" class="explain hidden"></div>
      <div class="nav-row">
        <button type="button" class="btn btn-secondary" id="prev-btn">Əvvəlki</button>
        <button type="button" class="btn" id="next-btn">Növbəti</button>
        <button type="button" class="btn hidden" id="finish-btn">Sınağı bitir</button>
      </div>
    </div>

    <div id="result-screen" class="card hidden">
      <h2 style="margin:0;">Nəticəniz</h2>
      <p id="score-summary" style="font-size:1.1rem; font-weight:700; margin:10px 0 14px;"></p>
      <div id="review-box"></div>
      <div style="margin-top:18px;">
        <button type="button" class="btn" id="restart-btn">Ana səhifəyə qayıt</button>
      </div>
    </div>
  </div>

  <footer>Bilik Arenası • Riyaziyyat Sınaq Portalı</footer>

  <script>
    // Şəkil əlavə etmək üçün sual obyektinə img: "şəkil_ünvanı" yazın (məsələn: img: "images/1.png")
    const customQuestions = {
      // Nümunə:
      // 5: [
      //   {
      //     q: "Şəkildəki düzbucaqlının sahəsini tapın.",
      //     img: "images/duzbucaqli.png",
      //     options: ["12 sm²", "15 sm²", "18 sm²", "20 sm²"],
      //     answer: "15 sm²",
      //     explain: "Sahə S = a · b düsturu ilə hesablanır."
      //   }
      // ]
    };

    function buildQuestionsForGrade(grade) {
      if (Array.isArray(customQuestions[grade]) && customQuestions[grade].length > 0) {
        return customQuestions[grade];
      }
      const list = [];
      for (let i = 1; i <= 20; i++) {
        const a = i * 2 + grade;
        const b = i + 3;
        const ans = a + b;
        const opts = [
          String(ans),
          String(ans + 2),
          String(Math.max(1, ans - 2)),
          String(ans + 4)
        ].sort((x, y) => x.localeCompare(y));

        list.push({
          q: `${grade}-ci sinif — Sual ${i}: ${a} + ${b} cəmini tapın.`,
          img: "",
          options: opts,
          answer: String(ans),
          explain: `${a} + ${b} = ${ans} olur.`
        });
      }
      return list;
    }

    let selectedGrade = 5;
    let questions = [];
    let currentIdx = 0;
    let userAnswers = {};
    let secondsLeft = 40 * 60;
    let timerInterval = null;

    const gradeListEl = document.getElementById("grade-list");
    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    for (let g = 1; g <= 11; g++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "grade-btn" + (g === selectedGrade ? " active" : "");
      btn.textContent = `${g}-ci sinif`;
      btn.addEventListener("click", () => {
        selectedGrade = g;
        document.querySelectorAll(".grade-btn").forEach(el => el.classList.remove("active"));
        btn.classList.add("active");
      });
      gradeListEl.appendChild(btn);
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function startQuiz() {
      questions = buildQuestionsForGrade(selectedGrade);
      currentIdx = 0;
      userAnswers = {};
      secondsLeft = 40 * 60;

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      document.getElementById("q-grade-label").textContent = `${selectedGrade}-ci sinif`;
      renderQuestion();

      clearInterval(timerInterval);
      document.getElementById("timer").textContent = formatTime(secondsLeft);
      timerInterval = setInterval(() => {
        secondsLeft = Math.max(0, secondsLeft - 1);
        document.getElementById("timer").textContent = formatTime(secondsLeft);
        if (secondsLeft === 0) {
          clearInterval(timerInterval);
          finishQuiz();
        }
      }, 1000);
    }

    function renderQuestion() {
      const item = questions[currentIdx];
      document.getElementById("q-progress").textContent = `Sual ${currentIdx + 1} / ${questions.length}`;
      document.getElementById("q-text").textContent = item.q;

      const imgEl = document.getElementById("q-img");
      if (item.img && item.img.trim() !== "") {
        imgEl.src = item.img.trim();
        imgEl.classList.remove("hidden");
      } else {
        imgEl.removeAttribute("src");
        imgEl.classList.add("hidden");
      }

      const optionsBox = document.getElementById("options-box");
      optionsBox.innerHTML = "";

      item.options.forEach(opt => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "option" + (userAnswers[currentIdx] === opt ? " selected" : "");
        b.textContent = opt;
        b.addEventListener("click", () => {
          userAnswers[currentIdx] = opt;
          renderQuestion();
        });
        optionsBox.appendChild(b);
      });

      const expEl = document.getElementById("instant-explain");
      if (userAnswers[currentIdx]) {
        expEl.classList.remove("hidden");
        expEl.textContent = `İzah: ${item.explain}`;
      } else {
        expEl.classList.add("hidden");
      }

      document.getElementById("prev-btn").disabled = currentIdx === 0;
      const isLast = currentIdx === questions.length - 1;
      document.getElementById("next-btn").classList.toggle("hidden", isLast);
      document.getElementById("finish-btn").classList.toggle("hidden", !isLast);
    }

    function finishQuiz() {
      clearInterval(timerInterval);
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      let correctCount = 0;
      const reviewBox = document.getElementById("review-box");
      reviewBox.innerHTML = "";

      questions.forEach((item, idx) => {
        const picked = userAnswers[idx];
        const isCorrect = picked === item.answer;
        if (isCorrect) correctCount++;

        const div = document.createElement("div");
        div.className = "explain";
        div.style.borderLeftColor = isCorrect ? "#15803d" : "#b91c1c";
        div.innerHTML = `
          <div><strong>${idx + 1}.</strong> ${item.q}</div>
          <div style="margin-top:6px;">Sizin cavabınız: <strong>${picked || "Cavab verilməyib"}</strong> | Düzgün cavab: <strong>${item.answer}</strong></div>
          <div style="margin-top:4px; color:var(--muted);">İzah: ${item.explain}</div>
        `;
        reviewBox.appendChild(div);
      });

      document.getElementById("score-summary").textContent =
        `${selectedGrade}-ci sinif üzrə nəticə: ${correctCount} / ${questions.length} düzgün cavab`;
    }

    document.getElementById("start-btn").addEventListener("click", startQuiz);
    document.getElementById("prev-btn").addEventListener("click", () => {
      if (currentIdx > 0) { currentIdx--; renderQuestion(); }
    });
    document.getElementById("next-btn").addEventListener("click", () => {
      if (currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); }
    });
    document.getElementById("finish-btn").addEventListener("click", finishQuiz);
    document.getElementById("restart-btn").addEventListener("click", () => {
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });
  </script>
</body>
</html>
