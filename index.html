<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilik Arenası — Onlayn Sınaq Platforması</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f3ff;
      --card: #ffffff;
      --primary: #5b21b6;
      --primary-dark: #2e1065;
      --primary-soft: #ede9fe;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --bad: #b91c1c;
      --bad-bg: #fee2e2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #ffffff;
      border-bottom: 1px solid #ede9fe;
      box-shadow: 0 2px 10px rgba(46, 16, 101, 0.05);
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4c1d95, #7c3aed);
      color: #fde047;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1rem;
    }

    .brand-title {
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--primary-dark);
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-link-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .icon-circle {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--primary);
      display: inline-grid;
      place-items: center;
      font-size: 0.85rem;
      font-weight: 800;
      text-decoration: none;
    }

    .container {
      max-width: 960px;
      margin: 18px auto 48px;
      padding: 0 16px;
    }

    .hero-card {
      border-radius: 22px;
      padding: 24px 20px 22px;
      background:
        radial-gradient(circle at 82% 18%, rgba(250, 204, 21, 0.22), transparent 34%),
        radial-gradient(circle at 15% 25%, rgba(167, 139, 250, 0.28), transparent 40%),
        linear-gradient(155deg, #4c1d95 0%, #3b0764 55%, #2e1065 100%);
      color: #ffffff;
      box-shadow: 0 14px 32px rgba(46, 16, 101, 0.24);
    }
